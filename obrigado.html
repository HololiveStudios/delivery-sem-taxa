<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado — Delivery Sem Taxa</title>
    <meta name="description" content="Seu diagnóstico foi enviado. Entraremos em contato pelo WhatsApp em breve.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
</head>

<body>
    <section class="hero" style="min-height: 100vh; text-align: center;">
        <div class="container"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="font-size: 4rem; margin-bottom: 1.5rem;">🎉</div>
            <h1 class="hero-title" style="text-align: center; max-width: 600px;">
                Diagnóstico <span class="highlight">enviado!</span>
            </h1>
            <p class="hero-subtitle" style="text-align: center; margin: 0 auto 2rem;">
                Em breve entraremos em contato pelo WhatsApp com seu plano personalizado. Fique de olho no celular!
            </p>

            <div id="resultSummary" style="max-width: 400px; width: 100%; margin-bottom: 2rem;">
                <!-- Populated by JS from URL params -->
            </div>

            <a class="btn btn-whatsapp btn-lg" id="whatsappBtnObrigado" href="#" target="_blank" rel="noopener">
                💬 Quero falar agora no WhatsApp
            </a>

            <a href="index.html" class="btn btn-secondary" style="margin-top: 1rem;">
                ← Voltar para a página
            </a>
        </div>
    </section>

    <script>
        // Read URL params
        const params = new URLSearchParams(window.location.search);
        const score = params.get('score') || '';
        const taxa = params.get('taxa') || '';
        const plano = params.get('plano') || '';
        const leadId = params.get('lead_id') || '';

        // Summary
        if (score && taxa && plano) {
            document.getElementById('resultSummary').innerHTML = `
        <div class="result-cards" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="result-card">
            <p class="result-card-label">Qualificação</p>
            <p class="result-card-value" style="color:var(--orange-400);">${score}%</p>
          </div>
          <div class="result-card">
            <p class="result-card-label">Taxa/mês estimada</p>
            <p class="result-card-value tax">R$ ${parseInt(taxa).toLocaleString('pt-BR')}</p>
          </div>
          <div class="result-card" style="grid-column:span 2;">
            <p class="result-card-label">Plano recomendado</p>
            <p class="result-card-value plan">🎯 ${plano}</p>
          </div>
        </div>
      `;
        }

        // WhatsApp btn
        const WHATSAPP_NUMBER = '5589994691009';
        const msg = encodeURIComponent(`Oi! Fiz o diagnóstico. Deu ${score}% e estimativa de R$${parseInt(taxa).toLocaleString('pt-BR')}/mês. Quero ver meu link pronto — Plano ${plano}.`);
        document.getElementById('whatsappBtnObrigado').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    </script>
</body>

</html>
